# Dependabot configuration for Haec's current dependency surface.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "13:37"
      timezone: "Europe/London"
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
