# One bounded runner validates every dogfood format. Individual tools remain
# visible as steps without allocating six separate runners.
name: "🟡 Check: RSR self-use (dogfooding)"

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: dogfood-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dogfood:
    name: Dogfood gate (consolidated)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Inventory dogfood formats
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          a2ml_count=$(find . -name '*.a2ml' -not -path './.git/*' | wc -l)
          k9_count=$(find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' | wc -l)
          config_count=$(find . \( -name '*.toml' -o -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) \
            -not -path './.git/*' -not -path './node_modules/*' -not -path './.deno/*' \
            -not -name 'package-lock.json' -not -name 'Cargo.lock' -not -name 'deno.lock' | wc -l)
          {
            echo "a2ml_count=$a2ml_count"
            echo "k9_count=$k9_count"
            echo "config_count=$config_count"
          } >> "$GITHUB_OUTPUT"
          if [ "$a2ml_count" -eq 0 ]; then
            echo "::warning::No .a2ml manifests found; every RSR repository should have 0-AI-MANIFEST.a2ml"
          fi
          if [ "$k9_count" -eq 0 ] && [ "$config_count" -gt 0 ]; then
            echo "::warning::Found $config_count config files but no K9 contracts"
          fi

      # hyperpolymath/a2ml-validate-action and hyperpolymath/k9-validate-action
      # do not exist — both 404. The steps therefore failed at "Set up job" on
      # every push, and an unresolvable action also breaks Dependabot's
      # github_actions updater. Validated inline until those are published.
      #
      # Scope is deliberately limited and stated honestly: these assert the
      # file-level envelope contract (encoding, non-emptiness, SPDX header, and
      # the K9 magic first line). They do NOT parse the A2ML grammar or
      # typecheck Nickel — that still needs the real validators.
      - name: Validate A2ML manifest envelopes
        id: a2ml
        if: steps.inventory.outputs.a2ml_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::empty A2ML manifest"; fail=1; continue
            fi
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"; fail=1; continue
            fi
            if ! grep -qE 'SPDX-License-Identifier:' "$f"; then
              echo "::error file=$f::missing SPDX-License-Identifier header"; fail=1
            fi
          done < <(find . -name '*.a2ml' -not -path './.git/*' -print0)
          [ "$fail" -eq 0 ] || { echo "::error::A2ML envelope check failed"; exit 1; }
          echo "A2ML envelope check: OK"

      - name: Validate K9 contract envelopes
        id: k9
        if: steps.inventory.outputs.k9_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::empty K9 contract"; fail=1; continue
            fi
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"; fail=1; continue
            fi
            first=$(head -1 "$f")
            case "$f" in
              # .k9.ncl must comment the magic so `nickel typecheck` still parses.
              *.k9.ncl) want='# K9!' ;;
              *)        want='K9!'  ;;
            esac
            if [ "$first" != "$want" ]; then
              echo "::error file=$f::first line must be '$want' (found: '$first')"; fail=1
            fi
            if ! grep -qE 'SPDX-License-Identifier:' "$f"; then
              echo "::error file=$f::missing SPDX-License-Identifier header"; fail=1
            fi
          done < <(find . \( -name '*.k9' -o -name '*.k9.ncl' \) -not -path './.git/*' -print0)
          [ "$fail" -eq 0 ] || { echo "::error::K9 envelope check failed"; exit 1; }
          echo "K9 envelope check: OK"

      - name: Scan for invisible characters
        id: empty_lint
        shell: bash
        run: |
          set -euo pipefail
          patterns='\xc2\xa0|\xe2\x80\x8b|\xe2\x80\x8c|\xe2\x80\x8d|\xef\xbb\xbf|\xc2\xad|\xe2\x80\x8e|\xe2\x80\x8f|\xe2\x80\xaa|\xe2\x80\xab|\xe2\x80\xac|\xe2\x80\xad|\xe2\x80\xae|\x00'
          results_file="${RUNNER_TEMP}/empty-lint-results.txt"
          find "$GITHUB_WORKSPACE" \
            -not -path '*/.git/*' -not -path '*/node_modules/*' \
            -not -path '*/.deno/*' -not -path '*/target/*' \
            -not -path '*/_build/*' -not -path '*/deps/*' \
            -not -path '*/external_corpora/*' -not -path '*/.lake/*' \
            -type f \( -name '*.rs' -o -name '*.ex' -o -name '*.exs' -o -name '*.res' \
              -o -name '*.js' -o -name '*.ts' -o -name '*.json' -o -name '*.toml' \
              -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.adoc' \
              -o -name '*.idr' -o -name '*.zig' -o -name '*.v' -o -name '*.jl' \
              -o -name '*.gleam' -o -name '*.hs' -o -name '*.ml' -o -name '*.sh' \) \
            -exec grep -Prl "$patterns" {} \; > "$results_file" 2>/dev/null || true
          findings=$(wc -l < "$results_file")
          echo "findings=$findings" >> "$GITHUB_OUTPUT"
          while IFS= read -r filepath; do
            [ -z "$filepath" ] && continue
            relative_path="${filepath#"$GITHUB_WORKSPACE"/}"
            echo "::warning file=${relative_path}::Invisible Unicode characters detected"
          done < "$results_file"

      - name: Check Groove integration
        id: groove
        shell: bash
        run: |
          set -euo pipefail
          has_manifest=false
          has_groove_code=false
          has_server=false
          manifest_valid=true
          if [ -f '.well-known/groove/manifest.json' ]; then
            has_manifest=true
            if ! jq empty .well-known/groove/manifest.json 2>/dev/null; then
              manifest_valid=false
              echo "::error file=.well-known/groove/manifest.json::Invalid JSON in Groove manifest"
            fi
          fi
          if grep -rql 'well-known/groove' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' --include='*.res' . 2>/dev/null; then
            has_groove_code=true
          fi
          if grep -rql 'TcpListener\|Bandit\|Plug.Cowboy\|httpz\|vweb\|axum::serve\|actix_web' --include='*.rs' --include='*.ex' --include='*.zig' --include='*.v' . 2>/dev/null; then
            has_server=true
          fi
          if [ "$has_server" = true ] && [ "$has_manifest" = false ] && [ "$has_groove_code" = false ]; then
            echo "::warning::Server code found without a Groove endpoint"
          fi
          {
            echo "has_manifest=$has_manifest"
            echo "has_groove_code=$has_groove_code"
            echo "has_server=$has_server"
            echo "manifest_valid=$manifest_valid"
          } >> "$GITHUB_OUTPUT"

      - name: Validate eclexiaiser manifest
        id: eclexiaiser
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f 'eclexiaiser.toml' ]; then
            echo 'has_manifest=false' >> "$GITHUB_OUTPUT"
            if [ -f 'Containerfile' ]; then
              echo "::warning::Containerfile present but no eclexiaiser.toml"
            fi
            exit 0
          fi
          echo 'has_manifest=true' >> "$GITHUB_OUTPUT"
          ok=1
          grep -qE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || { echo '::error::project.name is required'; ok=0; }
          functions=$(grep -cE '^[[:space:]]*\[\[functions\]\]' eclexiaiser.toml || true)
          [ "${functions:-0}" -ge 1 ] || { echo '::error::at least one [[functions]] entry is required'; ok=0; }
          names=$(grep -cE '^[[:space:]]*name[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || true)
          sources=$(grep -cE '^[[:space:]]*source[[:space:]]*=[[:space:]]*"[^"]+"' eclexiaiser.toml || true)
          [ "${names:-0}" -ge "$(( ${functions:-0} + 1 ))" ] || { echo '::error::a function has an empty or missing name'; ok=0; }
          [ "${sources:-0}" -ge "${functions:-0}" ] || { echo '::error::a function has an empty or missing source'; ok=0; }
          [ "$ok" -eq 1 ]

      - name: Write consolidated scorecard
        if: always()
        shell: bash
        env:
          A2ML_COUNT: ${{ steps.inventory.outputs.a2ml_count }}
          K9_COUNT: ${{ steps.inventory.outputs.k9_count }}
          CONFIG_COUNT: ${{ steps.inventory.outputs.config_count }}
          A2ML_OUTCOME: ${{ steps.a2ml.outcome }}
          K9_OUTCOME: ${{ steps.k9.outcome }}
          EMPTY_FINDINGS: ${{ steps.empty_lint.outputs.findings }}
          GROOVE_MANIFEST: ${{ steps.groove.outputs.has_manifest }}
          GROOVE_CODE: ${{ steps.groove.outputs.has_groove_code }}
          GROOVE_SERVER: ${{ steps.groove.outputs.has_server }}
          GROOVE_VALID: ${{ steps.groove.outputs.manifest_valid }}
          ECLEX_MANIFEST: ${{ steps.eclexiaiser.outputs.has_manifest }}
          ECLEX_OUTCOME: ${{ steps.eclexiaiser.outcome }}
        run: |
          set -euo pipefail
          score=0
          a2ml_status=':x:'
          k9_status=':x:'
          editor_status=':x:'
          groove_status=':ballot_box_with_check:'
          verisim_status=':ballot_box_with_check:'
          eclex_status=':ballot_box_with_check:'
          if [ "${A2ML_COUNT:-0}" -gt 0 ] && [ "$A2ML_OUTCOME" = success ]; then score=$((score + 1)); a2ml_status=':white_check_mark:'; fi
          if [ "${K9_COUNT:-0}" -gt 0 ] && [ "$K9_OUTCOME" = success ]; then score=$((score + 1)); k9_status=':white_check_mark:'; fi
          if [ -f '.editorconfig' ]; then score=$((score + 1)); editor_status=':white_check_mark:'; fi
          if [ "$GROOVE_MANIFEST" = true ] || [ "$GROOVE_CODE" = true ]; then score=$((score + 1)); groove_status=':white_check_mark:'; fi
          if grep -rql 'verisimdb\|VeriSimDB' --include='*.toml' --include='*.yaml' --include='*.yml' --include='*.json' --include='*.rs' --include='*.ex' . 2>/dev/null; then score=$((score + 1)); verisim_status=':white_check_mark:'; fi
          if [ "$ECLEX_MANIFEST" = true ] && [ "$ECLEX_OUTCOME" = success ]; then score=$((score + 1)); eclex_status=':white_check_mark:'; fi
          empty_status=':warning:'
          if [ "${EMPTY_FINDINGS:-0}" -eq 0 ]; then empty_status=':white_check_mark:'; fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Dogfooding Scorecard

          **Score: ${score}/6** · **one runner** · A2ML ${A2ML_COUNT:-0} · K9 ${K9_COUNT:-0} · configs ${CONFIG_COUNT:-0}

          | Tool/format | Result | Detail |
          |-------------|--------|--------|
          | A2ML | ${a2ml_status} | validator: ${A2ML_OUTCOME} |
          | K9 | ${k9_status} | validator: ${K9_OUTCOME} |
          | Empty-linter | ${empty_status} | ${EMPTY_FINDINGS:-0} finding(s) |
          | .editorconfig | ${editor_status} | repository policy |
          | Groove | ${groove_status} | manifest=${GROOVE_MANIFEST}, code=${GROOVE_CODE}, server=${GROOVE_SERVER}, valid=${GROOVE_VALID} |
          | VeriSimDB | ${verisim_status} | required only for stateful repositories |
          | eclexiaiser | ${eclex_status} | validator: ${ECLEX_OUTCOME} |
          EOF

      - name: Enforce validator results
        if: always()
        shell: bash
        env:
          A2ML_OUTCOME: ${{ steps.a2ml.outcome }}
          K9_OUTCOME: ${{ steps.k9.outcome }}
          ECLEX_OUTCOME: ${{ steps.eclexiaiser.outcome }}
          GROOVE_VALID: ${{ steps.groove.outputs.manifest_valid }}
        run: |
          set -euo pipefail
          failed=0
          for result in "$A2ML_OUTCOME" "$K9_OUTCOME" "$ECLEX_OUTCOME"; do
            if [ "$result" = failure ]; then failed=1; fi
          done
          if [ "$GROOVE_VALID" = false ]; then failed=1; fi
          if [ "$failed" -ne 0 ]; then
            echo '::error::One or more dogfood validators failed; see the consolidated scorecard'
            exit 1
          fi
