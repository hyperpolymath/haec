# This workflow is managed by gh actions-lock.
name: "🔴 Gate: Guix-only package policy"
on:
  push:
    branches: [main, master]
  pull_request:

# Estate guardrail: scope push to default branches so a PR fires once (not
# push+PR), and cancel superseded runs. Safe — read-only PR-triggered check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  guix-only-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Enforce Guix primary / Nix fallback
        run: |
          FAILED=false
          # Check for package manager files
          HAS_GUIX=$(find . -name "*.scm" -o -name ".guix-channel" -o -name "guix.scm" 2>/dev/null | head -1)
          HAS_NIX=$(find . -name "*.nix" 2>/dev/null | head -1)

          # Block new package-lock.json, yarn.lock, Gemfile.lock, etc.
          NEW_LOCKS=$(git diff --name-only --diff-filter=A HEAD~1 2>/dev/null | grep -E 'package-lock\.json|yarn\.lock|Gemfile\.lock|Pipfile\.lock|poetry\.lock|cargo\.lock' || true)
          if [ -n "$NEW_LOCKS" ]; then
            echo "❌ Foreign lock files added — this repo is Guix-only:"
            echo "$NEW_LOCKS"
            FAILED=true
          fi

          # Prefer Guix, fallback to Nix
          if [ -n "$HAS_GUIX" ]; then
            echo "✅ Guix package management detected (primary)"
          elif [ -n "$HAS_NIX" ]; then
            echo "✅ Nix package management detected (fallback)"
          else
            echo "ℹ️ Consider adding guix.scm or flake.nix for reproducible builds"
          fi

          if [ "$FAILED" = true ]; then
            echo "Guix-only package policy violated — see above."
            exit 1
          fi
          echo "✅ Guix-only package policy satisfied"
