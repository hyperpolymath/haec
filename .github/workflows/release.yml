name: "⚙ Auto: Release"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build libhaec
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:de9781906050dc44704ec6de0108c86f899ef17b2642932b79e00245d613b8ad
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Zig
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      - name: Typecheck and build release libraries
        shell: bash
        run: |
          set -euo pipefail
          # Same fix as ci.yml: never assert through a pipe under pipefail.
          ver="$(idris2 --version)"
          echo "idris2 --version -> ${ver}"
          case "$ver" in
            *"0.8.0"*) ;;
            *) echo "::error::expected Idris 2 0.8.0, got: ${ver}"; exit 1 ;;
          esac
          idris2 --typecheck abi.ipkg
          (
            cd src/interface/ffi
            zig build -Doptimize=ReleaseSafe --summary all
            zig build test -Doptimize=ReleaseSafe --summary all
          )

      - name: Package libraries and checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          archive="haec-${RELEASE_TAG}-linux-x86_64.tar.gz"
          tar -C src/interface/ffi/zig-out/lib -czf "$archive" libhaec.a libhaec.so
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: haec-release
          path: |
            haec-*.tar.gz
            haec-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: haec-release
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            artifacts/haec-*.tar.gz
            artifacts/haec-*.tar.gz.sha256
