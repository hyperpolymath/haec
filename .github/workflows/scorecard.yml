# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: "⚪ Advisory: OpenSSF Scorecard (score)"

on:
  schedule:
    - cron: '17 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    # The reusable runs OSSF Scorecard, which needs these beyond the
    # caller's top-level contents: read; a reusable requesting more
    # permissions than its caller grants is a startup_failure.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
